name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo-doctor
      - name: Regras da sacola, filtros e dados de exemplo
        run: npm test
      - run: npm run build:web
      - name: Navegador para os testes de ponta a ponta
        run: npx playwright install --with-deps chromium
      - name: Busca, sacola, pedido e favoritos na versão web
        run: npm run test:e2e
      - name: Guardar o rastro dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: test-results/
          retention-days: 7
